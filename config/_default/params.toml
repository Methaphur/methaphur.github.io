# -- Theme Options --
colorScheme = "one-light"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true

mainSections = ["blogs"]
disableTextInHeader = false
defaultSocialImage = "/img/hari.jpeg"

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "/blogs/"
  cardView = false

[article]
  showDate = true
  showAuthor = true
  showBreadcrumbs = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = false
  sharingLinks = ["email", "linkedin"]

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showCards = true
  orderByWeight = false
  groupByYear = false
  # Flip back to true once every post in content/blogs/ has a featured image;
  # with only some posts illustrated the card grid renders half-empty.
  cardView = false
  cardViewScreenWidth = false

[taxonomy]
  showTermCount = true
  cardView = false

[term]
  groupByYear = false
  cardView = false
