# -- Site Configuration --
theme = "blowfish"
baseURL = "https://methaphur.github.io/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 35
enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
